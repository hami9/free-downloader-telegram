version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: downloader_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot_network

  # Download Cluster API (Receives requests from Telegram Serverless @tgcloud/bot via fetch)
  cluster_api:
    build: .
    container_name: downloader_cluster_api
    restart: unless-stopped
    command: uvicorn backend-cluster.main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - bot_network

  # Distributed Worker Pool (Downloads videos, muxes with ffmpeg, and uploads to Telegram)
  worker:
    build: .
    restart: unless-stopped
    command: python -m app.queue.worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - worker_downloads:/app/downloads
    depends_on:
      - redis
    networks:
      - bot_network

volumes:
  redis_data:
  worker_downloads:

networks:
  bot_network:
    driver: bridge

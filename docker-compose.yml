version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: downloader_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bot_network

  bot:
    build: .
    container_name: downloader_bot
    restart: unless-stopped
    command: python -m app.bot
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - bot_network

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.queue.worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - worker_downloads:/app/downloads
    depends_on:
      - redis
    networks:
      - bot_network

# Uncomment this section if you want to run a Local Telegram Bot API Server (Upload up to 2GB)
#   telegram-bot-api:
